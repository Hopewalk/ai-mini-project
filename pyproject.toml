[project]
name = "land-appraisal"
version = "0.1.0"
description = "Thailand land appraisal prediction & location profiling (Regression, Classification, Clustering, Bayesian Network) with a Flask + MongoDB web app"
authors = [{ name = "พัฒนชัย พันธุ์เกตุ", email = "6710110280@coe.psu.ac.th" }]
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    # Web
    "flask>=3.0",
    "flask-wtf>=1.2",
    "pymongo>=4.6",
    "python-dotenv>=1.0",
    "gunicorn>=23.0",
    # Data & ML
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=15.0",
    "scipy>=1.11",
    # pinned: model files (joblib pickles) must load with the same versions they were trained with
    "scikit-learn==1.9.1",
    "joblib==1.6.0",
    "pgmpy==1.1.2",
    # Geo
    "pyproj>=3.6",
    "shapely>=2.0",
    "geopandas>=1.0",
    "pyogrio>=0.9",
    # Visualization
    "matplotlib>=3.8",
    "seaborn>=0.13",
    # Utilities
    "requests>=2.31",
    "tqdm>=4.66",
]

[tool.poetry]
# application, not a library: install dependencies only
package-mode = false

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0"
ipykernel = ">=6.29"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
